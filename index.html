<!doctype html>
<html lang="zh-CN" class="app-preparing">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f1ee">
  <meta name="application-name" content="两个人的一页">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <title>两个人的一页</title>
  <style>html.app-preparing #app{visibility:hidden}</style>
  <script>
    window.__pwaInstallPrompt=null;
    window.addEventListener('beforeinstallprompt',function(event){
      event.preventDefault();
      window.__pwaInstallPrompt=event;
    });
    window.__pwaInstalledStatus=async function(){
      if(window.matchMedia?.('(display-mode: standalone)').matches||navigator.standalone===true)return 'installed';
      if(typeof navigator.getInstalledRelatedApps!=='function')return 'unknown';
      try{
        const apps=await navigator.getInstalledRelatedApps();
        return apps.some(app=>app&&app.platform==='webapp')?'installed':'not-installed';
      }catch{return 'unknown'}
    };
    window.setTimeout(function(){document.documentElement.classList.remove('app-preparing')},2500);
  </script>
</head>
<body>
  <div class="ambient a1"></div><div class="ambient a2"></div>
  <main id="app" class="app-shell" aria-live="polite"></main>
  <script src="js/core/app.js?v=20260826-ownfinal1"></script>
  <script src="banks/either.js?v=20260824-1907"></script>
  <script src="banks/guess.js?v=20260824-1907"></script>
  <script src="banks/lights.js?v=20260824-1907"></script>
  <script src="banks/whatif.js?v=20260824-1907"></script>
  <script src="banks/rank.js?v=20260824-1907"></script>
  <script src="banks/memory.js?v=20260824-1907"></script>
  <script src="banks/who.js?v=20260824-1907"></script>
  <script src="banks/cohabit.js?v=20260824-1907"></script>
  <script src="banks/pref.js?v=20260824-1907"></script>
  <script src="banks/sweet.js?v=20260824-1907"></script>
  <script src="banks/odd.js?v=20260824-1907"></script>
  <script src="banks/talk.js?v=20260824-1907"></script>
  <script src="banks/normalize.js?v=20260824-1927"></script>
  <script src="banks/food.js?v=20260824-2042"></script>
  <script src="js/core/duo.js?v=20260826-ownfinal1"></script>
  <script src="js/features/quiz-flow.js?v=20260826-ownfinal1"></script>
  <script src="js/features/history.js?v=20260826-ownfinal1"></script>
  <script src="js/core/shell.js?v=20260826-ownfinal1"></script>
  <script>
    (function(){
      async function syncInstallRow(){
        const button=document.querySelector('[data-settings-install]');
        if(!button)return;
        const status=await window.__pwaInstalledStatus?.();
        if(status!=='installed')return;
        button.dataset.pwaInstalled='1';
        const title=button.querySelector('b'),detail=button.querySelector('small');
        if(title)title.textContent='已安装到桌面';
        if(detail)detail.textContent='已经安装，可从开始菜单或 Edge 应用中打开';
      }
      document.addEventListener('click',function(event){
        if(event.target.closest?.('[data-settings-open]'))setTimeout(syncInstallRow,0);
      },true);
      document.addEventListener('click',async function(event){
        const button=event.target.closest?.('[data-settings-install]');
        if(!button)return;
        event.preventDefault();
        event.stopImmediatePropagation();
        const status=button.dataset.pwaInstalled==='1'?'installed':await window.__pwaInstalledStatus?.();
        if(status==='installed'){
          document.querySelector('.settings-backdrop')?.remove();
          showToast('已经安装到桌面，可从开始菜单或 Edge 应用中打开');
          return;
        }
        if(/Edg\//.test(navigator.userAgent||'')&&!window.__pwaInstallPrompt){
          showToast('若没有安装弹窗，可能已经安装；可在开始菜单或 edge://apps 查看');
        }
        window.couplePWA?.showInstall?.();
      },true);
    })();
    window.coupleCore?.boot?.();window.coupleCloud?.init?.();
  </script>
</body>
</html>

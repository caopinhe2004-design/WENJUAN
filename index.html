  <style>
    html{background:#f7f1ee}
    html.app-booting #app,html.app-booting .ambient{visibility:hidden}
    #app-splash{position:fixed;inset:0;z-index:100000;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 38%,#fff9f1 0,#fbf1e7 42%,#f7e9df 100%);color:#94786b;opacity:1;transition:opacity .38s ease}
    #app-splash.done{opacity:0;pointer-events:none}
    .splash-inner{position:relative;z-index:2;width:min(86vw,430px);display:flex;flex-direction:column;align-items:center;text-align:center;transform:translateY(-2vh)}
    .splash-mark{width:clamp(128px,34vw,178px);height:auto;display:block;border-radius:25%;filter:drop-shadow(0 18px 28px rgba(116,83,68,.10));animation:splash-mark-in .72s cubic-bezier(.2,.7,.2,1) both}
    .splash-title{margin:34px 0 0;font-family:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;font-size:clamp(30px,8vw,43px);font-weight:400;line-height:1.25;letter-spacing:.16em;text-indent:.16em;color:#9a796a;text-shadow:0 1px 0 rgba(255,255,255,.55);animation:splash-copy-in .7s .12s ease both}
    .splash-ornament{display:flex;align-items:center;gap:9px;margin:20px 0 17px;color:#cba99c;animation:splash-copy-in .7s .2s ease both}
    .splash-ornament::before,.splash-ornament::after{content:"";width:42px;height:1px;background:linear-gradient(90deg,transparent,rgba(190,153,138,.48))}
    .splash-ornament::after{background:linear-gradient(90deg,rgba(190,153,138,.48),transparent)}
    .splash-petals{position:relative;width:19px;height:13px}
    .splash-petals::before,.splash-petals::after{content:"";position:absolute;top:1px;width:9px;height:12px;border-radius:9px 9px 2px 9px;transform:rotate(-38deg);background:#e6b9aa}
    .splash-petals::before{left:1px}.splash-petals::after{right:1px;transform:scaleX(-1) rotate(-38deg);background:#cdb9a8}
    .splash-subtitle{max-width:340px;margin:0;padding:0 14px;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:clamp(13px,3.55vw,16px);font-weight:400;line-height:1.9;letter-spacing:.08em;color:#a4887b;animation:splash-copy-in .7s .28s ease both}
    .splash-wave{position:absolute;z-index:1;left:-18vw;width:136vw;height:27vh;border-radius:50% 50% 0 0/28% 28% 0 0;pointer-events:none}
    .splash-wave.w1{bottom:-16vh;background:#e5d5c6;transform:rotate(5deg);box-shadow:0 -1px 0 rgba(255,255,255,.75)}
    .splash-wave.w2{bottom:-20vh;left:-10vw;background:#f4ddd2;transform:rotate(-7deg);box-shadow:0 -1px 0 rgba(255,255,255,.72)}
    .splash-wave.w3{bottom:-24vh;left:-28vw;background:#cda799;transform:rotate(8deg);opacity:.62}
    @keyframes splash-mark-in{from{opacity:0;transform:translateY(9px) scale(.965)}to{opacity:1;transform:none}}
    @keyframes splash-copy-in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
    @media(max-width:430px){.splash-inner{transform:translateY(-3vh)}.splash-title{margin-top:28px}.splash-ornament{margin:17px 0 14px}}
    @media(prefers-reduced-motion:reduce){#app-splash{transition:none}.splash-mark,.splash-title,.splash-ornament,.splash-subtitle{animation:none}}
  </style>
  <script>
    window.__splashStart=performance.now();
    window.__coupleQuizBootFallback=setTimeout(function(){
      document.documentElement.classList.remove('app-booting');
      var splash=document.getElementById('app-splash');
      if(splash){splash.classList.add('done');setTimeout(function(){splash.remove()},420)}
    },2800);
    window.__pwaInstallPrompt=null;
    window.addEventListener('beforeinstallprompt',function(event){
      event.preventDefault();
      window.__pwaInstallPrompt=event;
    });
  </script>

  <script>
    (function(){
      clearTimeout(window.__coupleQuizBootFallback);
      var reveal=function(){
        document.documentElement.classList.remove('app-booting');
        var splash=document.getElementById('app-splash');
        if(splash){splash.classList.add('done');setTimeout(function(){splash.remove()},420)}
      };
      var elapsed=performance.now()-(window.__splashStart||0);
      var wait=Math.max(0,760-elapsed);
      setTimeout(function(){
        if(window.requestAnimationFrame)requestAnimationFrame(function(){requestAnimationFrame(reveal)});
        else reveal();
      },wait);
    })();

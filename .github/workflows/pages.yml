name: Verify and Deploy GitHub Pages

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wenjuan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply one-shot CSS ownership migration
        if: github.head_ref == 'css-ownership-final-pass' && hashFiles('scripts/migrate-css-ownership.js') != ''
        run: |
          node scripts/migrate-css-ownership.js
          git restore .github/workflows/pages.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Complete canonical CSS ownership migration"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Check JavaScript syntax
        run: find . -type f -name '*.js' -not -path './.git/*' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Check question banks
        run: node scripts/check-question-banks.js
      - name: Check architecture and patch rules
        run: node scripts/check-architecture.js

  browser:
    name: Browser regression
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install test dependencies
        run: npm install --no-audit --no-fund --prefer-offline
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run deterministic browser tests
        run: npx playwright test --workers=2 --retries=0 --grep-invert '双客户端显示编辑状态但只同步已确认答案，离线后回来继续同步'
      - name: Run realtime integration test
        run: npx playwright test --workers=1 --retries=1 --grep '双客户端显示编辑状态但只同步已确认答案，离线后回来继续同步'
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Package Pages artifact
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [verify, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Build minimal static site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js .nojekyll _site/
          cp -R css js banks icons _site/
          built_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          printf '{"sha":"%s","builtAt":"%s"}\n' "$GITHUB_SHA" "$built_at" > _site/deploy-meta.json
          test ! -e _site/tests
          test ! -e _site/scripts
          test ! -e _site/.github
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy and verify live site
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: package
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify exact deployed commit
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          modules=(
            js/core/app.js
            js/core/duo.js
            js/features/quiz-flow.js
            js/features/history.js
            js/core/shell.js
          )
          for attempt in $(seq 1 12); do
            bust="${GITHUB_SHA}-${attempt}-$(date +%s)"
            meta="$(curl -fsSL -H 'Cache-Control: no-cache' "${PAGE_URL%/}/deploy-meta.json?v=${bust}" || true)"
            index="$(curl -fsSL -H 'Cache-Control: no-cache' "${PAGE_URL}?v=${bust}" || true)"
            ok=1
            printf '%s' "$meta" | grep -Fq "\"sha\":\"${GITHUB_SHA}\"" || ok=0
            for module in "${modules[@]}"; do
              printf '%s' "$index" | grep -Fq "$module" || ok=0
              curl -fsSL -o /dev/null -H 'Cache-Control: no-cache' "${PAGE_URL%/}/${module}?v=${bust}" || ok=0
            done
            if [ "$ok" -eq 1 ]; then
              echo "Live Pages site matches commit ${GITHUB_SHA} and serves all five canonical modules."
              exit 0
            fi
            echo "Waiting for Pages propagation (${attempt}/12)..."
            sleep 5
          done
          echo "Pages deployed, but live verification did not match commit ${GITHUB_SHA}."
          exit 1

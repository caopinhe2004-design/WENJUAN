name: Verify and Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark commit as pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.sha,
              state: 'pending',
              context: 'wenjuan/pages-ci',
              description: '正在检查题库、浏览器交互和双人同步',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: find . -type f -name '*.js' -not -path './.git/*' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check

      - name: Check question banks
        run: node scripts/check-question-banks.js

      - name: Install E2E dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npm run test:e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -e
          for attempt in $(seq 1 12); do
            index="$(curl -fsSL -H 'Cache-Control: no-cache' "${PAGE_URL}?sha=${GITHUB_SHA}" || true)"
            script="$(curl -fsSL -H 'Cache-Control: no-cache' "${PAGE_URL%/}/js/core/runtime.js?sha=${GITHUB_SHA}" || true)"
            if printf '%s' "$index" | grep -q 'js/core/runtime.js' && printf '%s' "$script" | grep -q 'Consolidated interaction + realtime stability runtime'; then
              echo "GitHub Pages is serving the organized app."
              exit 0
            fi
            echo "Waiting for Pages propagation (${attempt}/12)..."
            sleep 5
          done
          echo "Pages deployment completed but the site did not pass the smoke check in time."
          exit 1

  report:
    if: always()
    needs: [verify, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Publish readable commit status
        uses: actions/github-script@v7
        with:
          script: |
            const verify = '${{ needs.verify.result }}';
            const deploy = '${{ needs.deploy.result }}';
            const ok = verify === 'success' && deploy === 'success';
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'wenjuan/pages-ci',
              description: ok ? 'E2E、题库检查和 Pages 部署均通过' : `验证=${verify}，部署=${deploy}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

name: One-time architecture consolidation

on:
  push:
    branches: ["refactor-app-architecture"]

permissions:
  contents: write

jobs:
  consolidate:
    if: ${{ !contains(github.event.head_commit.message, 'Apply architecture refactor') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor-app-architecture
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate migration script
        run: node --check scripts/refactor-runtime.js
      - name: Consolidate runtime
        run: node scripts/refactor-runtime.js
      - name: Validate generated JavaScript
        run: find js scripts -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout HEAD -- .github/workflows/pages.yml .github/workflows/refactor-architecture.yml
          git add -A
          git commit -m "Apply architecture refactor"
          git push origin HEAD:refactor-app-architecture

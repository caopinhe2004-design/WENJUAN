name: Apply refactor source fixes

on:
  push:
    branches: ["refactor-app-architecture"]
    paths:
      - "scripts/apply-refactor-fixes.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor-app-architecture
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply source fixes
        run: |
          node scripts/apply-refactor-fixes.js
          rm scripts/apply-refactor-fixes.js
      - name: Verify syntax
        run: find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Commit cleaned source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js scripts/apply-refactor-fixes.js
          git commit -m "Fix canonical runtime syntax" || exit 0
          git push origin HEAD:refactor-app-architecture

name: Apply room join refactor

on:
  push:
    branches: ["room-join-nickname"]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: room-join-nickname
      - name: Refactor room join and nickname UX
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('js/core/duo.js')
          s = path.read_text()

          pattern = r"async function initCrypto\(secret\)\{.*?\}\nasync function encryptMessage"
          replacement = """async function cryptoContext(secret){const raw=duoFromB64Url(secret);if(raw.length<16)throw new Error('房间链接无效');const roomKey=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['encrypt','decrypt']);const hash=new Uint8Array(await crypto.subtle.digest('SHA-256',raw)),roomId=duoHex(hash.slice(0,16));return {roomKey,roomId,topicBase:`${DUO_PREFIX}/${roomId}`}}\nasync function initCrypto(secret){const ctx=await cryptoContext(secret);duo.roomKey=ctx.roomKey;duo.roomId=ctx.roomId;duo.topicBase=ctx.topicBase;duo.storeKey=`coupleSleepQuiz.duo.room.${duo.roomId}.${duo.clientId}`}\nasync function encryptMessage"""
          s, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          assert n == 1, 'initCrypto block not found'

          old = "async function decryptMessage(text){try{const env=JSON.parse(text),plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:duoFromB64Url(env.iv)},duo.roomKey,duoFromB64Url(env.ct));return JSON.parse(new TextDecoder().decode(plain))}catch{return null}}"
          new = "async function decryptWithKey(text,roomKey){try{const env=JSON.parse(text),plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:duoFromB64Url(env.iv)},roomKey,duoFromB64Url(env.ct));return JSON.parse(new TextDecoder().decode(plain))}catch{return null}}\nasync function decryptMessage(text){return decryptWithKey(text,duo.roomKey)}"
          assert old in s, 'decryptMessage block not found'
          s = s.replace(old, new, 1)

          pattern = r"async function roomCodeSecret\(value\)\{.*?\}\nwindow\.coupleRoomCode=.*?;\n"
          replacement = """async function roomCodeSecret(value){const code=roomCodeNormalize(value);if(!roomCodeValid(code))throw new Error('房间码无效');const bytes=new TextEncoder().encode(`couple-room-code-v2:${code}`),hash=new Uint8Array(await crypto.subtle.digest('SHA-256',bytes));return duoB64Url(hash)}
async function roomCodeExists(secret){
  const ctx=await cryptoContext(secret);
  return new Promise(resolve=>{
    let done=false,connected=false,settleTimer=null;
    const finish=value=>{if(done)return;done=true;clearTimeout(settleTimer);clearTimeout(hardTimer);mqtt.end();resolve(value)};
    const clientId=`probe_${crypto.randomUUID().replace(/-/g,'').slice(0,20)}`;
    const mqtt=new TinyMQTT(DUO_WSS,{clientId,username:DUO_USER,password:DUO_PASS,keepalive:15,reconnectPeriod:7000});
    mqtt.subscribe(`${ctx.topicBase}/claim/+`).subscribe(`${ctx.topicBase}/state/+`);
    mqtt.on('connect',()=>{connected=true;settleTimer=setTimeout(()=>finish(false),2500)});
    mqtt.on('message',async(topic,payload)=>{const msg=await decryptWithKey(new TextDecoder().decode(payload),ctx.roomKey);if(!msg)return;if(msg.kind==='claim'&&msg.active!==false)return finish(true);if(msg.kind==='state'&&msg.active!==false)return finish(true)});
    const hardTimer=setTimeout(()=>finish(connected?false:null),6500);
  });
}
window.coupleRoomCode={normalize:roomCodeNormalize,valid:roomCodeValid,generate:roomCodeGenerate,deriveSecret:roomCodeSecret,exists:roomCodeExists};
"""
          s, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          assert n == 1, 'roomCode block not found'

          pattern = r"function closeModal\(\).*?\nfunction renderHome\(\)\{"
          replacement = """function closeModal(){document.querySelector('.duo-modal-backdrop')?.remove()}
function askNickname({title='加入双人房间',confirmText='进入房间',onDone}={}){closeModal();const bg=document.createElement('div');bg.className='duo-modal-backdrop';bg.innerHTML=`<section class=\"duo-modal\" role=\"dialog\" aria-modal=\"true\"><small>双人房间</small><h2>${esc(title)}</h2><p>给自己留一个对方能认出来的名字。</p><input maxlength=\"24\" autocomplete=\"nickname\" placeholder=\"你的昵称\" value=\"${esc(duo.nickname)}\"><div class=\"duo-modal-actions\"><button class=\"ghost\" data-cancel>取消</button><button class=\"primary\" data-ok>${esc(confirmText)}</button></div></section>`;document.body.appendChild(bg);const input=bg.querySelector('input'),finish=()=>{const name=input.value.trim();if(!name)return showToast('先写一个昵称');duo.nickname=name;localStorage.setItem(DUO_NICK_KEY,name);closeModal();onDone?.(name)};bg.querySelector('[data-ok]').onclick=finish;bg.querySelector('[data-cancel]').onclick=closeModal;input.onkeydown=e=>{if(e.key==='Enter')finish()};requestAnimationFrame(()=>input.focus())}
function showNicknameEditor(){askNickname({title:'修改昵称',confirmText:'保存昵称',onDone:async()=>{if(duo.active){const current=duo.claims.get(duo.clientId)||{};duo.claims.set(duo.clientId,{...current,clientId:duo.clientId,nickname:duo.nickname,joinedAt:duo.joinedAt,claimedAt:Date.now(),active:true});await publishClaim(true).catch(()=>{});await publishState().catch(()=>{});duoRefreshUI()}showToast('昵称已保存')}})}
function showJoinCodeModal(){closeModal();const bg=document.createElement('div');bg.className='duo-modal-backdrop';bg.innerHTML=`<section class=\"duo-modal room-code-modal\" role=\"dialog\" aria-modal=\"true\"><small>双人房间</small><h2>输入房间码</h2><p>这里只加入已经建立的房间，不会创建新房间。</p><input data-room-code-input maxlength=\"24\" autocomplete=\"off\" placeholder=\"房间码\"><div class=\"room-code-error\" data-room-code-error></div><div class=\"duo-modal-actions\"><button class=\"ghost\" data-cancel>取消</button><button class=\"primary\" data-room-code-submit>加入房间</button></div></section>`;document.body.appendChild(bg);const input=bg.querySelector('[data-room-code-input]'),submit=bg.querySelector('[data-room-code-submit]'),error=bg.querySelector('[data-room-code-error]');bg.querySelector('[data-cancel]').onclick=closeModal;submit.onclick=async()=>{const code=roomCodeNormalize(input.value);if(!roomCodeValid(code)){error.textContent='房间码需为 1–24 位，并且只使用字母、数字、中文、短横线或下划线';return}submit.disabled=true;submit.textContent='查找中…';error.textContent='正在确认房间是否存在…';try{const secret=await roomCodeSecret(code),exists=await roomCodeExists(secret);if(exists===null){error.textContent='暂时无法确认房间，请检查网络后重试';return}if(!exists){error.textContent='没有找到这个房间，请检查房间码';return}const go=async()=>{await activate(secret,{code});home()};if(duo.nickname){closeModal();await go()}else{closeModal();askNickname({title:'加入双人房间',confirmText:'加入房间',onDone:go})}}catch{error.textContent='房间查找失败，请稍后重试'}finally{if(document.body.contains(bg)){submit.disabled=false;submit.textContent='加入房间'}}};requestAnimationFrame(()=>input.focus())}
async function createGeneratedRoom(){const code=roomCodeGenerate(),go=async()=>{const secret=await roomCodeSecret(code);await activate(secret,{code});home()};if(duo.nickname)await go();else askNickname({title:'创建双人房间',confirmText:'创建房间',onDone:go})}

function renderHome(){"""
          s, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          assert n == 1, 'modal block not found'

          pattern = r"  if\(!duo\.active\)\{box\.innerHTML=.*?\}\n  else\{"
          replacement = """  if(!duo.active){box.innerHTML=`<div class=\"duo-panel-head\"><div><h3>把这一页递给 TA</h3><p>开一个只属于你们的房间，把房间码发过去。等对方进来，就从同一道题开始。</p></div><span class=\"duo-badge\"><i class=\"duo-dot off\"></i>单人模式</span></div><div class=\"duo-actions duo-entry-actions\"><button class=\"duo-primary\" data-duo-create>邀请 TA 一起来</button><button data-duo-nickname>修改昵称</button><button data-duo-join-code>输入房间码</button></div>`;box.querySelector('[data-duo-create]').onclick=createGeneratedRoom;box.querySelector('[data-duo-nickname]').onclick=showNicknameEditor;box.querySelector('[data-duo-join-code]').onclick=showJoinCodeModal}
  else{"""
          s, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          assert n == 1, 'inactive home block not found'

          old = "<div class=\"duo-actions\"><button data-copy-invite>复制邀请链接</button><button data-duo-leave>退出房间</button></div>`;box.querySelector('[data-copy-invite]').onclick=async()=>{try{await navigator.clipboard.writeText(inviteURL());showToast('邀请链接已复制')}catch{showToast('复制失败，请从地址栏复制')}};box.querySelector('[data-duo-leave]').onclick=duoLeaveRoom;"
          new = "<div class=\"duo-actions\"><button data-copy-invite>复制邀请链接</button><button data-duo-nickname>修改昵称</button><button data-duo-leave>退出房间</button></div>`;box.querySelector('[data-copy-invite]').onclick=async()=>{try{await navigator.clipboard.writeText(inviteURL());showToast('邀请链接已复制')}catch{showToast('复制失败，请从地址栏复制')}};box.querySelector('[data-duo-nickname]').onclick=showNicknameEditor;box.querySelector('[data-duo-leave]').onclick=duoLeaveRoom;"
          assert old in s, 'active home action block not found'
          s = s.replace(old, new, 1)

          path.write_text(s)

          e2e = Path('tests/e2e.spec.js')
          text = e2e.read_text()
          old_title = "test('双客户端显示编辑状态但只同步已确认答案，离线后回来继续同步'"
          assert old_title in text, 'realtime e2e title not found'
          e2e.write_text(text.replace(old_title, "test('@realtime 双客户端显示编辑状态但只同步已确认答案，离线后回来继续同步'", 1))

          room_test = r'''const { test, expect } = require('@playwright/test');

async function boot(page){
  await page.goto('/');
  await expect(page.locator('[data-open]')).toHaveCount(13);
}

test('首页用修改昵称替代自定义房间码', async ({ page }) => {
  await boot(page);
  await expect(page.locator('[data-duo-create-custom]')).toHaveCount(0);
  const nickname = page.locator('[data-duo-nickname]');
  await expect(nickname).toHaveText('修改昵称');
  await nickname.click();
  const modal = page.locator('.duo-modal');
  await expect(modal).toContainText('修改昵称');
  await modal.locator('input').fill('新的昵称');
  await modal.locator('[data-ok]').click();
  expect(await page.evaluate(() => localStorage.getItem('coupleSleepQuiz.duo.nickname'))).toBe('新的昵称');
});

test('@realtime 输入房间码只加入已存在房间，不存在的房间不会被创建', async ({ browser }) => {
  const contextA = await browser.newContext();
  const contextB = await browser.newContext();
  const pageA = await contextA.newPage();
  const pageB = await contextB.newPage();

  await boot(pageA);
  await pageA.locator('[data-duo-create]').click();
  let modal = pageA.locator('.duo-modal');
  await modal.locator('input').fill('甲');
  await modal.locator('[data-ok]').click();
  await pageA.waitForFunction(() => typeof duo !== 'undefined' && duo.active && duo.connected && !!duo.roomCode, null, { timeout: 25000 });
  const code = await pageA.evaluate(() => duo.roomCode);
  const roomIdA = await pageA.evaluate(() => duo.roomId);

  await boot(pageB);
  await pageB.locator('[data-duo-join-code]').click();
  modal = pageB.locator('.duo-modal');
  await expect(modal).toContainText('不会创建新房间');
  await modal.locator('[data-room-code-input]').fill(code.toUpperCase());
  await modal.locator('[data-room-code-submit]').click();
  await expect(pageB.locator('.duo-modal')).toContainText('加入双人房间', { timeout: 12000 });
  await pageB.locator('.duo-modal input').fill('乙');
  await pageB.locator('.duo-modal [data-ok]').click();
  await pageB.waitForFunction(() => typeof duo !== 'undefined' && duo.active && duo.connected, null, { timeout: 25000 });
  expect(await pageB.evaluate(() => duo.roomId)).toBe(roomIdA);

  await pageB.locator('[data-duo-leave]').click();
  await pageB.waitForFunction(() => !duo.active);
  const missing = `missing${Date.now().toString(36).slice(-6)}`;
  await pageB.locator('[data-duo-join-code]').click();
  modal = pageB.locator('.duo-modal');
  await modal.locator('[data-room-code-input]').fill(missing);
  await modal.locator('[data-room-code-submit]').click();
  await expect(modal.locator('[data-room-code-error]')).toContainText('没有找到这个房间', { timeout: 12000 });
  expect(await pageB.evaluate(() => duo.active)).toBe(false);
  await expect(modal).toBeVisible();

  await contextA.close();
  await contextB.close();
});

test('普通创建房间只生成一个简短房间码', async ({ page }) => {
  await boot(page);
  const generated = await page.evaluate(() => Array.from({length:512}, () => coupleRoomCode.generate()));
  expect(generated.every(code => /^[a-z2-9]{6}$/.test(code))).toBe(true);

  await page.locator('[data-duo-create]').click();
  const modal = page.locator('.duo-modal');
  await modal.locator('input').fill('甲');
  await modal.locator('[data-ok]').click();
  await page.waitForFunction(() => typeof duo !== 'undefined' && duo.active && !!document.querySelector('[data-room-code]'));
  const code = (await page.locator('[data-room-code]').textContent()).trim();
  expect(code).toMatch(/^[a-z2-9]{6}$/);
  await page.locator('[data-duo-leave]').click();
});

test('房间码支持短码，并拒绝不支持的符号', async ({ page }) => {
  await boot(page);
  expect(await page.evaluate(() => coupleRoomCode.valid('a'))).toBe(true);
  expect(await page.evaluate(() => coupleRoomCode.valid('room2026'))).toBe(true);
  expect(await page.evaluate(() => coupleRoomCode.valid('我们的房间'))).toBe(true);

  await page.locator('[data-duo-join-code]').click();
  const modal = page.locator('.duo-modal');
  await modal.locator('[data-room-code-input]').fill('🙂');
  await modal.locator('[data-room-code-submit]').click();
  await expect(modal.locator('[data-room-code-error]')).toContainText('1–24 位');
  await expect(modal).toBeVisible();
  expect(await page.evaluate(() => duo.active)).toBe(false);
});

test('房间码界面不包含个人示例', async ({ page }) => {
  await boot(page);
  await page.locator('[data-duo-join-code]').click();
  await expect(page.locator('.room-code-modal')).not.toContainText(/cph|wyy/i);
});
'''
          Path('tests/room-code.spec.js').write_text(room_test)
          PY


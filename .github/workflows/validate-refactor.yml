name: Validate architecture refactor

on:
  push:
    branches: ["refactor-app-architecture"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: find . -type f -name '*.js' -not -path './.git/*' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Check question banks
        run: node scripts/check-question-banks.js
      - name: Check architecture
        run: node scripts/check-architecture.js

  browser:
    needs: static
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
            specs: tests/e2e.spec.js
          - group: ui
            specs: tests/cloud-history-ui.spec.js tests/either-title.spec.js tests/food-special.spec.js tests/free-choice.spec.js tests/home-copy.spec.js
          - group: platform
            specs: tests/pwa.spec.js tests/room-code.spec.js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install E2E dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run ${{ matrix.group }} browser tests
        run: npx playwright test ${{ matrix.specs }} --retries=0
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: refactor-${{ matrix.group }}-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

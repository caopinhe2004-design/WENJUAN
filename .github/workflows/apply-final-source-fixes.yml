name: Apply remaining CI fixes

on:
  push:
    branches: ["refactor-app-architecture"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor-app-architecture
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Update formal source modules
        run: |
          python - <<'PY'
          from pathlib import Path

          qpath = Path('js/features/quiz-flow.js')
          q = qpath.read_text(encoding='utf-8')

          old = "  const buttons=Array.from({length:total},(_,n)=>{const part=n+1,r=partRange(q,part);return `<button data-part=\"${part}\"><b>第 ${part} 轮</b><span>${r.start+1}–${r.end} 题</span></button>`}).join('');"
          new = "  const buttons=Array.from({length:total},(_,n)=>{const part=n+1,r=partRange(q,part),label=q.id==='food'&&part===7?'水果':q.id==='food'&&part===8?'特殊口味':`第 ${part} 轮`;return `<button data-part=\"${part}\"><b>${label}</b><span>${r.start+1}–${r.end} 题</span></button>`}).join('');"
          if old not in q:
              raise SystemExit('showPartChooser target not found')
          q = q.replace(old, new, 1)

          old = "  const options=item[1]||[],k=key(q.id,i),customOpen=!!quizDrafts.customOpen[k],customValue=quizDrafts.custom[k]??choiceAnswerText(value);"
          new = "  const options=item[1]||[],k=key(q.id,i),customOpen=!!quizDrafts.customOpen[k]||choiceAnswerIsCustom(value),customValue=quizDrafts.custom[k]??choiceAnswerText(value);"
          if old not in q:
              raise SystemExit('renderChoice target not found')
          q = q.replace(old, new, 1)
          qpath.write_text(q, encoding='utf-8')

          dpath = Path('js/core/duo.js')
          d = dpath.read_text(encoding='utf-8')
          old = "function formatAnswer(q,i,value){if(value&&typeof value==='object'&&value.kind==='custom')return value.text||'未作答';if(!hasAnswer(value))return '未作答';if(q.type==='choice'){if(q.id==='who'&&(value===0||value===1))return `${value===0?'A':'B'} · ${roleName(Number(value))}`;return q.questions[i]?.[1]?.[Number(value)]??'未作答'}if(q.type==='scale')return `${value} / 5`;if(q.type==='rank')return Array.isArray(value)?value.join(' ＞ '):'未作答';return String(value)}"
          new = "function formatAnswer(q,i,value){if(value&&typeof value==='object'&&value.kind==='custom')return value.text||'未作答';if(!hasAnswer(value))return '未作答';if(q.type==='choice'){if(q.id==='who'&&(value===0||value===1))return `${value===0?'A':'B'} · ${roleName(Number(value))}`;const fixed=q.questions[i]?.[1]?.[Number(value)]??'未作答';return q.id==='food'?fixed:`${String.fromCharCode(65+Number(value))}${fixed}`}if(q.type==='scale')return `${value} / 5`;if(q.type==='rank')return Array.isArray(value)?value.join(' ＞ '):'未作答';return String(value)}"
          if old not in d:
              raise SystemExit('formatAnswer target not found')
          d = d.replace(old, new, 1)
          dpath.write_text(d, encoding='utf-8')
          PY
          node --check js/features/quiz-flow.js
          node --check js/core/duo.js
      - name: Commit source fixes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/features/quiz-flow.js js/core/duo.js
          git commit -m "Fix remaining browser regressions"
          git push origin HEAD:refactor-app-architecture
